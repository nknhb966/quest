<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>craftARt Lite</title>
  <meta name="viewport" content="width=device-width">
  <link rel="icon" href="data:">
  <style>body{font-family:sans-serif}</style>
</head>
<body>
  <header>
    <h1>craftARt Lite</h1>
    使用ライブラリ：<a href="https://github.com/code4fukui/egxr.js/blob/main/egxr.js" target="_blank" rel="noopener">egxr.js</a>, <a href="https://github.com/code4fukui/vr-lenspark/blob/main/threeutil.js" target="_blank" rel="noopener">threeutil.js</a><br>
    <label for="modelSelect">モデルを選択：</label>
    <select id="modelSelect"></select>
  </header>

  <script type="importmap">
  { "imports": {
      "three": "https://code4fukui.github.io/three.js/build/three.module.js",
      "three/addons/": "https://code4fukui.github.io/three.js/examples/jsm/"
  } }
  </script>

  <script type="module">
  import { THREE, scene, camera, renderer, ctrls } from "https://code4fukui.github.io/egxr.js/egxr.js";
  import { initXR, waitLoadGLTF, createModelImage, createModelText, isVisionPro } from "https://code4fukui.github.io/vr-lenspark/threeutil.js";

  // ▼ 年度設定（models.csv・GLBの基準URL）。年度が変わったらここを差し替え
  const ASSET_BASE = "https://echizencity.github.io/opendata/kokufuhakkutsu3/";
  const csvURL = ASSET_BASE + "models.csv";
  const resolveUrl = (p)=>{ p=(p||"").trim(); if(!p) return ""; if(/^https?:/i.test(p)) return p; return ASSET_BASE + p.replace(/^\.?\//,""); };

  const easing = 0.1;
  const offy = isVisionPro() ? 0.6 : 0;
  const SPECIAL_KEYWORD_OFFSETS_Y = { "遺構": -1.5 };

  let currentModel=null, showInfo=true, txts=[], isScaling=false, isRotating=false;
  let initialDistance=null, initialScale=1, lastCenterPos=null, lastCtrlPos=null, lastDirection=null;
  let isLoadingModel=false, lastScalePercent=100, isAnimationEnabled=true;

  const menu=new THREE.Group(); scene.add(menu);
  let targetPosition=new THREE.Vector3(), targetScale=new THREE.Vector3(1,1,1), targetQuaternion=new THREE.Quaternion();

  function parseCSV(csvData){
    const lines=csvData.replace(/^\uFEFF/,"").split("\n"); const result=[]; const headers=lines[0].split(",");
    for(let i=1;i<lines.length;i++){ if(lines[i].trim()==="") continue; const obj={}; const cur=lines[i].split(",");
      for(let j=0;j<headers.length;j++){ obj[headers[j].trim()]=(cur[j]||"").trim(); } result.push(obj); }
    return result;
  }
  function disposeMaterial(m){ if(Array.isArray(m)){ m.forEach(x=>{ if(x.map)x.map.dispose(); x.dispose(); }); } else { if(m.map)m.map.dispose(); m.dispose(); } }
  function disposeModel(model){ model.traverse(ch=>{ if(ch.isMesh){ ch.geometry?.dispose(); disposeMaterial(ch.material); } }); scene.remove(model); }

  const createLabelButton=(text,bg="#44ccff",fg="#ffffff",w=512,h=128)=>{
    const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h; const ctx=canvas.getContext("2d");
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h); ctx.fillStyle=fg; ctx.font="bold 40px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(text,w/2,h/2);
    const tex=new THREE.CanvasTexture(canvas); const mat=new THREE.MeshBasicMaterial({map:tex, side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(0.16,0.04), mat); mesh.userData.label=text; return mesh;
  };

  const createModelDescription=(text,w=1.0,color="white",size=64,maxChars=15,parent)=>{
    const toZen=(s)=>s.replace(/[A-Za-z0-9!-/:-@¥[-`{-~]/g,(c)=>String.fromCharCode(c.charCodeAt(0)+0xFEE0)).replace(/ /g,"　");
    const z=toZen(text); const lines=[]; for(let i=0;i<z.length;i+=maxChars) lines.push(z.substring(i,i+maxChars));
    const canvas=document.createElement("canvas"); const ctx=canvas.getContext("2d");
    const cw=size*maxChars, lh=size*1.2, ch=lh*lines.length; canvas.width=cw; canvas.height=ch;
    ctx.font=`${size}px sans-serif`; ctx.fillStyle=color; ctx.strokeStyle="black"; ctx.lineWidth=size*0.02;
    for(let i=0;i<lines.length;i++){ const y=(i+1)*lh-(size*0.2); ctx.fillText(lines[i],0,y); ctx.strokeText(lines[i],0,y); }
    const hh=w/canvas.width*canvas.height; return createModelImage(canvas,w,hh,false,parent);
  };

  function updateInfoVisibility(){ txts.forEach(o=>o.visible=showInfo); }
  function replaceButton(oldBtn, text, bg, fg){ const nb=createLabelButton(text,bg,fg); nb.position.copy(oldBtn.position); nb.userData={...oldBtn.userData};
    if(oldBtn.material){ if(oldBtn.material.map)oldBtn.material.map.dispose(); oldBtn.material.dispose(); } if(oldBtn.geometry)oldBtn.geometry.dispose(); menu.remove(oldBtn); menu.add(nb); }
  function updateToggleButtonAppearance(b){ replaceButton(b,"情報表示切替", showInfo?"#333333":"#cccccc", showInfo?"#ffffff":"#000000"); }
  function updateAnimationToggleButtonAppearance(b){ replaceButton(b,"アニメーション", isAnimationEnabled?"#ff6666":"#ffe5e5", isAnimationEnabled?"#ffffff":"#cc0000"); }

  async function loadModel(item){
    if(isLoadingModel) return; isLoadingModel=true;
    const path=resolveUrl(item.path), name=item.name||"";
    if(currentModel){ disposeModel(currentModel); txts.forEach(t=>scene.remove(t)); txts=[]; currentModel=null; }
    const model=await waitLoadGLTF(path); model.userData.path=path;
    let yOffset=offy-0.2; for(const kw in SPECIAL_KEYWORD_OFFSETS_Y){ if(name.includes(kw)){ yOffset+=SPECIAL_KEYWORD_OFFSETS_Y[kw]; break; } }
    model.position.set(0,yOffset,-0.5); model.scale.set(1,1,1); scene.add(model); currentModel=model;

    const txt1=createModelText("100%",0.1); const txt2=createModelText(name,0.2);
    txt1.position.set(model.position.x, offy, model.position.z);
    txt2.position.set(model.position.x+0.2, offy-0.1, model.position.z);
    scene.add(txt1); scene.add(txt2); txts=[txt1,txt2];

    if(item.description){ const d=createModelDescription(item.description,0.5); d.position.set(model.position.x-0.4, offy-0.1, model.position.z); scene.add(d); txts.push(d); }

    Array.from(menu.children).forEach(oldBtn=>{ if(!oldBtn.userData.path) return; const sel=oldBtn.userData.path===path;
      replaceButton(oldBtn, oldBtn.userData.name, sel?"#0000ff":"#44ccff", sel?"#ffffff":"#000000"); });

    targetPosition.copy(model.position); targetScale.set(1,1,1); targetQuaternion.copy(model.quaternion);

    model.animate=()=>{
      if(!isAnimationEnabled) return;
      const sel=ctrls.filter(c=>c.selected);
      if(sel.length===2){
        const [p1,p2]=[sel[0].position,sel[1].position];
        const center=new THREE.Vector3().addVectors(p1,p2).multiplyScalar(0.5);
        const dist=p1.distanceTo(p2); const dir=new THREE.Vector2(p2.x-p1.x,p2.y-p1.y).normalize();
        if(!isScaling){ initialDistance=dist; initialScale=model.scale.x; lastCenterPos=center.clone(); lastDirection=dir.clone(); isScaling=true; isRotating=false; }
        else { const nf=dist/initialDistance; const ns=initialScale*nf; targetScale.set(ns,ns,ns);
          const dl=center.clone().sub(lastCenterPos); targetPosition.add(dl); lastCenterPos.copy(center);
          const ang=Math.atan2(dir.y,dir.x)-Math.atan2(lastDirection.y,lastDirection.x);
          targetQuaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),ang)); lastDirection.copy(dir); }
        lastCtrlPos=null; return;
      }
      if(sel.length===1){ const cur=sel[0].position;
        if(!isRotating){ lastCtrlPos=cur.clone(); isRotating=true; isScaling=false; initialDistance=null; lastCenterPos=null; lastDirection=null; }
        else { const d=cur.clone().sub(lastCtrlPos); const sp=8.0;
          const qx=new THREE.Quaternion().setFromEuler(new THREE.Euler(d.y*-sp,0,0,'XYZ'));
          const qy=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,d.x*sp,0,'XYZ'));
          targetQuaternion.premultiply(qy).premultiply(qx); lastCtrlPos.copy(cur); }
        return;
      }
      isScaling=false; isRotating=false; initialDistance=null; lastCenterPos=null; lastCtrlPos=null; lastDirection=null;
    };
    isLoadingModel=false; updateInfoVisibility();
  }

  const loadMenuFromCSV=async ()=>{
    scene.add(new THREE.AmbientLight(0xffffff,1));
    let records=[];
    try{ const res=await fetch(csvURL); records=parseCSV(await res.text()); }catch(e){ const s=document.getElementById("modelSelect"); s.innerHTML="<option>models.csvを読み込めませんでした</option>"; return; }

    const modelSelect=document.getElementById("modelSelect"); modelSelect.innerHTML="";
    records.forEach((item,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=item.name||("モデル "+(i+1)); modelSelect.appendChild(o); });
    modelSelect.addEventListener("change", async e=>{ const item=records[e.target.value]; if(item) await loadModel(item); });

    menu.clear();
    const spacingX=0.2, spacingY=0.1, perRow=5, total=records.length, totalRows=Math.ceil(total/perRow);
    records.forEach((item,i)=>{ const btn=createLabelButton(item.name||("モデル "+(i+1)));
      btn.userData.path=resolveUrl(item.path); btn.userData.name=item.name||("モデル "+(i+1)); btn.userData.description=item.description; btn.userData.url=item.url; btn.userData._item=item;
      const row=Math.floor(i/perRow), idxInRow=i%perRow;
      const inThis=(row===totalRows-1 && total%perRow!==0)? total%perRow : perRow; const offX=(inThis-1)/2;
      btn.position.x=(idxInRow-offX)*spacingX; btn.position.y=-0.3-row*spacingY; btn.position.z=-0.2; menu.add(btn); });

    if(records[0]) await loadModel(records[0]);

    const mk=(text,bg,fg,y,key)=>{ const b=createLabelButton(text,bg,fg); b.position.set(-0.4,y,-0.2); b.userData[key]=true; menu.add(b); return b; };
    mk("情報表示切替","#333333","#ffffff",-0.1,"toggleInfo");
    mk("アニメーション","#ff6666","#ffffff",-0.2,"toggleAnimation");
    mk("リセット","#333333","#ffffff",0.0,"reset");
  };
  loadMenuFromCSV();

  const handleButton=(child)=>{
    if(child.userData.toggleInfo){ showInfo=!showInfo; updateInfoVisibility(); updateToggleButtonAppearance(child); return; }
    if(child.userData.toggleAnimation){ isAnimationEnabled=!isAnimationEnabled; updateAnimationToggleButtonAppearance(child); return; }
    if(child.userData.reset){ targetScale.set(1,1,1); targetQuaternion.identity(); return; }
    if(currentModel?.userData?.path===child.userData.path) return;
    if(child.userData._item) loadModel(child.userData._item);
  };
  const onMenuClick=(ctrl)=>{ for(const child of menu.children){ const wp=child.getWorldPosition(new THREE.Vector3()); if(ctrl.position.distanceTo(wp)<0.08) handleButton(child); } };

  // マウス・タッチ操作
  const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
  let isLeftDragging=false, isRightDragging=false, lastMousePos=null, prevMouse={x:0,y:0};
  let isUserScaling=false, isUserRotating=false, initialTouchDist=0, lastTouchCenter=null, lastTouchAngle=null;
  function onClickMenu(e){ mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; raycaster.setFromCamera(mouse,camera);
    const hit=raycaster.intersectObjects(menu.children)[0]; if(hit) handleButton(hit.object); }
  function onMouseDown(e){ if(e.button===0)isLeftDragging=true; else if(e.button===2)isRightDragging=true; lastMousePos={x:e.clientX,y:e.clientY}; }
  function onMouseMove(e){ if(!currentModel||!lastMousePos) return; const dx=e.clientX-lastMousePos.x, dy=e.clientY-lastMousePos.y;
    const nx=dx/innerWidth, ny=dy/innerHeight;
    if(isLeftDragging){ const qx=new THREE.Quaternion().setFromEuler(new THREE.Euler(ny*8,0,0,'XYZ')); const qy=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,nx*8,0,'XYZ')); targetQuaternion.premultiply(qy).premultiply(qx); }
    else if(isRightDragging){ targetPosition.x+=nx*0.5; targetPosition.y-=ny*0.5; } lastMousePos={x:e.clientX,y:e.clientY}; }
  function onMouseUp(e){ if(e.button===0)isLeftDragging=false; if(e.button===2)isRightDragging=false; lastMousePos=null; }
  function onWheel(e){ if(!currentModel) return; targetScale.multiplyScalar(e.deltaY<0?1.1:0.9); }
  function onTouchStart(e){ if(e.touches.length===2){ isUserScaling=true; const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; initialTouchDist=Math.hypot(dx,dy); initialScale=currentModel?.scale?.x||1; lastTouchCenter={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2}; lastTouchAngle=Math.atan2(dy,dx); }
    else if(e.touches.length===1){ isUserRotating=true; prevMouse.x=e.touches[0].clientX; prevMouse.y=e.touches[0].clientY; } }
  function onTouchMove(e){ if(!currentModel) return;
    if(e.touches.length===2&&isUserScaling){ e.preventDefault(); const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; const dist=Math.hypot(dx,dy); targetScale.setScalar(initialScale*dist/initialTouchDist);
      const nc={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2}; targetPosition.x+=(nc.x-lastTouchCenter.x)/innerWidth; targetPosition.y-=(nc.y-lastTouchCenter.y)/innerHeight; lastTouchCenter=nc;
      const na=Math.atan2(dy,dx); const ad=-(na-lastTouchAngle); targetQuaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),ad)); lastTouchAngle=na; }
    else if(e.touches.length===1&&isUserRotating){ e.preventDefault(); const dx=e.touches[0].clientX-prevMouse.x, dy=e.touches[0].clientY-prevMouse.y;
      const qx=new THREE.Quaternion().setFromEuler(new THREE.Euler(dy*0.01,0,0,'XYZ')); const qy=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,dx*0.01,0,'XYZ')); targetQuaternion.premultiply(qy).premultiply(qx); prevMouse.x=e.touches[0].clientX; prevMouse.y=e.touches[0].clientY; } }
  function onTouchEnd(){ isUserScaling=false; isUserRotating=false; lastTouchAngle=null; }
  (function(){ const dom=renderer.domElement;
    dom.addEventListener("click",onClickMenu); dom.addEventListener("mousedown",onMouseDown); dom.addEventListener("mousemove",onMouseMove); dom.addEventListener("mouseup",onMouseUp);
    dom.addEventListener("wheel",onWheel); dom.addEventListener("contextmenu",e=>e.preventDefault());
    dom.addEventListener("touchstart",onTouchStart,{passive:false}); dom.addEventListener("touchmove",onTouchMove,{passive:false}); dom.addEventListener("touchend",onTouchEnd);
  })();

  renderer.setAnimationLoop(()=>{
    if(currentModel){
      currentModel.animate();
      currentModel.position.lerp(targetPosition,easing);
      currentModel.scale.lerp(targetScale,easing);
      currentModel.quaternion.slerp(targetQuaternion,easing);
      const pct=Math.round(currentModel.scale.x*100);
      if(txts[0]&&pct!==lastScalePercent){ txts[0].geometry.dispose(); scene.remove(txts[0]); const nt=createModelText(`${pct}%`,0.1); nt.position.set(0,offy,-0.5); scene.add(nt); txts[0]=nt; lastScalePercent=pct; }
      txts.forEach(i=>i.lookAt(camera.position));
    }
    for(const ctrl of ctrls){ if(ctrl.selected&&!ctrl.userData.justSelected){ ctrl.userData.justSelected=true; onMenuClick(ctrl); } else if(!ctrl.selected){ ctrl.userData.justSelected=false; } }
    renderer.render(scene,camera);
  });
  </script>
</body>
</html>
