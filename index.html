<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドット恐竜図鑑</title>
<style>
  :root{
    --ink:#241d33; --paper:#f6ecd4; --paper2:#efe0be;
    --amber:#ffb648; --amber-d:#e8892f; --night:#1a1530; --night2:#241c3f;
    --line:#3a2f57;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #2c2350 0%, var(--night) 60%),
      var(--night);
    color:var(--paper);
    font-family: "Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic",
                 "YuGothic","Zen Maru Gothic",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    /* うっすらドットの背景で「点」を主張 */
    background-image:
      radial-gradient(1200px 600px at 50% -10%, #2c2350 0%, var(--night) 60%),
      radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.6px);
    background-size: auto, 10px 10px;
    padding: clamp(20px,4vw,52px) 16px 60px;
  }
  header{ max-width:960px; margin:0 auto 30px; text-align:center; }
  .kicker{
    display:inline-block; font-size:12px; letter-spacing:.28em; font-weight:700;
    color:var(--night); background:var(--amber); padding:5px 12px; border-radius:2px;
    box-shadow:3px 3px 0 var(--amber-d);
  }
  h1{
    margin:.5em 0 .18em; font-size:clamp(30px,7vw,58px); font-weight:800; letter-spacing:.02em;
    color:var(--amber);
    /* ドットっぽい段状の影 */
    text-shadow:2px 0 0 var(--amber-d), 0 2px 0 var(--amber-d), 2px 2px 0 var(--amber-d),
                4px 4px 0 rgba(0,0,0,.35);
  }
  header p{ margin:0; color:#d7c9ef; font-size:clamp(13px,2.4vw,15px); }
  .grid{
    max-width:960px; margin:0 auto;
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
  }
  @media(max-width:760px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  .card{
    position:relative; background:var(--paper);
    border-radius:12px; padding:12px 10px 14px;
    box-shadow:0 8px 0 #cdbb90, 0 14px 24px rgba(0,0,0,.35);
    border:2px solid #d9c79b;
  }
  .no{
    position:absolute; top:8px; left:10px; font-size:11px; font-weight:800;
    color:#b98a3a; letter-spacing:.12em;
  }
  .stage{
    background:
      linear-gradient(#fbf4e2,#f0e2bf);
    border-radius:8px; margin:2px 0 8px; padding:8px 0 4px;
    display:flex; align-items:flex-end; justify-content:center;
    box-shadow:inset 0 2px 6px rgba(120,90,40,.18);
    /* ステージにも微細なドット */
    background-image: linear-gradient(#fbf4e2,#f0e2bf),
      radial-gradient(rgba(150,110,50,.12) 1px, transparent 1.5px);
    background-size:auto, 7px 7px;
  }
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges; width:100%; height:auto; display:block; }
  .name{ text-align:center; color:var(--ink); font-weight:800; font-size:15px; }
  .kana{ text-align:center; color:#8a7550; font-size:11px; letter-spacing:.14em; margin-top:1px; }
  footer{ max-width:960px; margin:28px auto 0; text-align:center; color:#b3a6d0; font-size:12px; }
  @media(prefers-reduced-motion:reduce){ canvas{} }
</style>
</head>
<body>
  <header>
    <span class="kicker">越前国府発掘クエスト</span>
    <h1>ドット恐竜図鑑</h1>
    <p>そっと なでたくなる、8ひきの ちいさな相棒たち。</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer>ぜんぶ ドットで つくった SDきょうりゅう ／ タップでも 見られます</footer>

<script>
/* ───────── ピクセル描画ユーティリティ ───────── */
function mk(w,h){ return {w,h,d:new Uint8Array(w*h)}; }
function px(g,x,y,c){ x|=0; y|=0; if(x<0||y<0||x>=g.w||y>=g.h) return; g.d[y*g.w+x]=c; }
function get(g,x,y){ if(x<0||y<0||x>=g.w||y>=g.h) return 0; return g.d[y*g.w+x]; }
function rect(g,x0,y0,x1,y1,c){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) px(g,x,y,c); }
function ell(g,cx,cy,rx,ry,c){ for(let y=-ry;y<=ry;y++) for(let x=-rx;x<=rx;x++){
  if((x*x)/(rx*rx+1e-6)+(y*y)/(ry*ry+1e-6) <= 1.06) px(g,cx+x,cy+y,c); } }
function disc(g,cx,cy,r,c){ ell(g,cx,cy,r,r,c); }
function tri(g,ax,ay,bx,by,cx,cy,c){
  const minx=Math.min(ax,bx,cx),maxx=Math.max(ax,bx,cx),miny=Math.min(ay,by,cy),maxy=Math.max(ay,by,cy);
  const s=(x,y,x0,y0,x1,y1)=>(x-x1)*(y0-y1)-(x0-x1)*(y-y1);
  for(let y=miny;y<=maxy;y++) for(let x=minx;x<=maxx;x++){
    const d1=s(x,y,ax,ay,bx,by),d2=s(x,y,bx,by,cx,cy),d3=s(x,y,cx,cy,ax,ay);
    const neg=(d1<0)||(d2<0)||(d3<0), pos=(d1>0)||(d2>0)||(d3>0);
    if(!(neg&&pos)) px(g,x,y,c);
  }
}
// シルエットの外側に1pxの縁取り(色 index=1)
function outline(g){
  const src=g.d.slice();
  for(let y=0;y<g.h;y++) for(let x=0;x<g.w;x++){
    if(src[y*g.w+x]!==0) continue;
    if(src[y*g.w+(x-1)]|| (x+1<g.w&&src[y*g.w+x+1]) || (y>0&&src[(y-1)*g.w+x]) || (y+1<g.h&&src[(y+1)*g.w+x]))
      g.d[y*g.w+x]=1;
  }
}
// かわいい顔（大きな瞳・ほっぺ・小さな口）。open=false でまばたき
function face(g, lx,rx,ey, open, mouthY){
  if(open){
    for(const ex of [lx,rx]){
      disc(g,ex,ey,3,7);            // 白目
      disc(g,ex,ey+1,2,8);          // 黒目
      px(g,ex-1,ey-1,7); px(g,ex,ey-1,7); px(g,ex-1,ey,7); // ぷるっとした光
    }
  }else{
    for(const ex of [lx,rx]){ rect(g,ex-2,ey,ex+2,ey,8); rect(g,ex-1,ey+1,ex+1,ey+1,8); }
  }
  // ほっぺ
  disc(g,lx-3,ey+3,1,10); px(g,lx-3,ey+3,10);
  disc(g,rx+3,ey+3,1,10);
  // 口
  const mx=(lx+rx>>1); px(g,mx,mouthY,8); px(g,mx-1,mouthY,8); px(g,mx+1,mouthY,8); px(g,mx,mouthY+1,8);
}

/* ───────── 各恐竜（32×32 基本 / 一部は独自サイズ） ───────── */
// パレット index: 1縁,2体,3体暗,4腹,5装飾,6装飾2,7白,8黒,10ほっぺ
const SHARE={7:'#ffffff',8:'#26202f',10:'#ff9fb0'};
function P(o){ const a=[null]; for(let i=1;i<=10;i++) a[i]=o[i]||SHARE[i]||null; return a; }

const DINOS=[
{ key:'trex', name:'ティラノ', kana:'T-REX', w:32,h:32,
  pal:P({1:'#2f5c3c',2:'#5fae6a',3:'#468f50',4:'#d9edb2',5:'#ffffff'}),
  draw(g,open){
    // しっぽ
    tri(g,3,26,10,20,10,27,2); disc(g,10,24,4,2);
    // 体
    ell(g,17,23,8,7,2); ell(g,17,25,5,4,4);
    // 後ろ足
    rect(g,11,28,14,31,3); rect(g,20,28,23,31,3);
    // ちび手
    rect(g,22,20,25,21,2); px(g,25,22,5);
    // 頭（大）
    ell(g,16,12,9,8,2); ell(g,16,15,8,4,3);
    // 口・きば
    rect(g,10,15,22,17,3); px(g,12,18,7); px(g,14,18,7); px(g,18,18,7); px(g,20,18,7);
    outline(g);
    face(g,12,20,12,open,16);
  }},

{ key:'tri', name:'トリケラ', kana:'TRICERATOPS', w:32,h:32,
  pal:P({1:'#7a4a24',2:'#c98a4f',3:'#a4713a',4:'#e7cb9c',5:'#f1e4c2',6:'#7a5a2e'}),
  draw(g,open){
    // フリル（頭のうしろに扇状）
    ell(g,16,10,10,6,5);
    // 体・足・しっぽ
    tri(g,4,27,10,22,11,28,2); ell(g,17,24,8,6,2); ell(g,17,26,5,4,4);
    rect(g,11,28,14,31,3); rect(g,20,28,23,31,3);
    // 頭（フリルの前・下）
    ell(g,16,16,9,7,2); ell(g,16,18,8,4,3);
    // くちばし
    tri(g,11,20,11,23,16,21,6);
    // 角：眉2本（フリルの上へ突き出す）＋鼻1本（顔の前）
    tri(g,8,10,11,10,7,3,5); tri(g,21,10,24,10,25,3,5);
    tri(g,15,13,17,13,16,8,5);
    outline(g);
    face(g,12,20,16,open,20);
  }},

{ key:'stego', name:'ステゴ', kana:'STEGOSAURUS', w:32,h:32,
  pal:P({1:'#2f6a62',2:'#56a89e',3:'#3d857c',4:'#c2e7e0',5:'#e58a3c',6:'#f4b25e'}),
  draw(g,open){
    // しっぽ＋トゲ（右下）
    tri(g,24,26,31,21,30,28,2); px(g,31,22,6); px(g,30,20,6);
    // 体
    ell(g,15,22,9,7,2); ell(g,15,24,6,4,4);
    rect(g,10,27,13,31,3); rect(g,18,27,21,31,3);
    // 頭（大・前向き）
    ell(g,15,13,9,8,2); ell(g,15,16,8,4,3);
    // 背びれ（頭上〜背にアーチ状）
    const plates=[[7,10],[11,7],[15,6],[19,7],[23,10]];
    plates.forEach(([x,y],i)=>{ const s=(i===2?5:4); tri(g,x-2,y+3,x+2,y+3,x,y-s,5); tri(g,x-1,y+2,x+1,y+2,x,y-1,6); });
    outline(g);
    face(g,11,19,13,open,17);
  }},

{ key:'brachi', name:'ブラキオ', kana:'BRACHIOSAURUS', w:32,h:34,
  pal:P({1:'#4a3a7a',2:'#9a86d6',3:'#6f5ba8',4:'#dbd1f2',5:'#b7a6e6'}),
  draw(g,open){
    // 体
    ell(g,14,26,8,6,2); ell(g,14,28,5,4,4);
    rect(g,9,30,12,33,3); rect(g,17,30,20,33,3);
    // しっぽ
    tri(g,2,29,8,24,9,30,2);
    // 長い首（カーブ）
    const neck=[[15,22],[16,19],[17,16],[19,13],[21,10],[23,8]];
    for(const [x,y] of neck) disc(g,x,y,3,2);
    // 小さな頭（上）
    ell(g,24,7,4,4,2); px(g,27,6,2); px(g,28,6,4); // 鼻先
    outline(g);
    face(g,22,26,7,open,9);
  }},

{ key:'raptor', name:'ラプトル', kana:'VELOCIRAPTOR', w:32,h:32,
  pal:P({1:'#6a4420',2:'#d1a85c',3:'#a5813f',4:'#eed7a4',5:'#f6ecd2',6:'#8a5a2e'}),
  draw(g,open){
    // しっぽ（ながく後ろへ）
    tri(g,2,20,12,18,12,24,2); disc(g,11,21,4,2);
    // 体
    ell(g,17,22,7,6,2); ell(g,17,24,4,4,4);
    // 足＋大きなカギ爪
    rect(g,13,27,16,31,3); rect(g,19,27,22,31,3); px(g,17,31,5); px(g,17,32,5);
    // 頭（やや前傾）＋羽毛のトサカ
    ell(g,18,12,8,7,2); ell(g,18,14,7,4,3);
    px(g,13,6,6); px(g,15,5,6); px(g,17,5,6); // 頭の羽
    tri(g,24,11,24,15,28,13,2); // 前に出た口先
    px(g,27,13,5);
    outline(g);
    face(g,15,21,12,open,15);
  }},

{ key:'para', name:'パラサ', kana:'PARASAUROLOPHUS', w:32,h:32,
  pal:P({1:'#2f6a48',2:'#62b487',3:'#3f8a5f',4:'#cdebd8',5:'#e8663f',6:'#f2a06a'}),
  draw(g,open){
    // うしろへ伸びるトサカ
    const crest=[[14,7],[11,5],[8,5],[6,7]];
    for(const [x,y] of crest){ disc(g,x,y,2,5); }
    tri(g,13,8,16,9,7,6,6);
    // 体・足・しっぽ
    tri(g,3,27,9,22,10,28,2); ell(g,17,24,8,6,2); ell(g,17,26,5,4,4);
    rect(g,11,28,14,31,3); rect(g,20,28,23,31,3);
    // 頭（ダックビル）
    ell(g,18,14,8,7,2); ell(g,18,16,7,4,3);
    rect(g,22,15,27,18,2); px(g,27,16,3); px(g,27,17,3); // 平たい口
    outline(g);
    face(g,15,21,13,open,16);
  }},

{ key:'anky', name:'アンキロ', kana:'ANKYLOSAURUS', w:32,h:32,
  pal:P({1:'#4a4f34',2:'#8a9066',3:'#656b48',4:'#c9c090',5:'#bcc38a',6:'#5f6547'}),
  draw(g,open){
    // しっぽ＋こん棒
    rect(g,4,24,11,26,2); disc(g,4,25,3,6);
    // 低く幅広い体
    ell(g,18,25,10,5,2); ell(g,18,26,7,3,4);
    rect(g,11,28,14,31,3); rect(g,22,28,25,31,3);
    // 甲羅のコブ
    for(const [x,y] of [[13,21],[17,20],[21,21],[25,22]]) disc(g,x,y,2,5);
    // 側面スパイク（外向き）
    px(g,8,25,6); px(g,7,25,6); px(g,28,26,6); px(g,29,26,6);
    // 頭
    ell(g,25,24,5,4,2);
    tri(g,22,21,25,22,21,19,5); tri(g,28,21,25,22,29,19,5); // 頭の角（外向き）
    outline(g);
    face(g,23,27,24,open,26);
  }},

{ key:'ptera', name:'プテラノ', kana:'PTERANODON', w:40,h:30,
  pal:P({1:'#3a577c',2:'#6f97c9',3:'#4f74a0',4:'#cfe0f2',5:'#e8663f',6:'#a9c4e0'}),
  draw(g,open){
    // 翼（左右に大きく）
    tri(g,20,14,3,7,10,17,6); tri(g,20,14,37,7,30,17,6);
    tri(g,20,13,6,6,20,10,2); tri(g,20,13,34,6,20,10,2); // 翼の腕
    // 体
    ell(g,20,16,4,5,2); ell(g,20,18,3,3,4);
    // 足
    rect(g,18,21,19,24,3); rect(g,21,21,22,24,3);
    // 頭＋長いくちばし＋トサカ
    ell(g,20,9,4,4,2);
    tri(g,22,8,22,11,30,9,7); // くちばし
    tri(g,18,8,20,6,14,5,5);  // トサカ（後ろ）
    outline(g);
    face(g,18,22,9,open,11);
  }},
];

/* ───────── レンダリング（プリレンダ＋バウンド＋まばたき） ───────── */
const SCALE=9;
function bake(D, open){
  const g=mk(D.w,D.h); D.draw(g,open);
  const cv=document.createElement('canvas'); cv.width=D.w; cv.height=D.h;
  const ctx=cv.getContext('2d'); const img=ctx.createImageData(D.w,D.h);
  for(let i=0;i<g.d.length;i++){ const c=g.d[i]; let hex=D.pal[c];
    let r=0,gr=0,b=0,a=0;
    if(hex){ a=255; r=parseInt(hex.slice(1,3),16); gr=parseInt(hex.slice(3,5),16); b=parseInt(hex.slice(5,7),16); }
    img.data[i*4]=r; img.data[i*4+1]=gr; img.data[i*4+2]=b; img.data[i*4+3]=a;
  }
  ctx.putImageData(img,0,0); return cv;
}

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const grid=document.getElementById('grid');
const sprites=[];
DINOS.forEach((D,idx)=>{
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<span class="no">№'+String(idx+1).padStart(2,'0')+'</span>'+
    '<div class="stage"></div><div class="name">'+D.name+'</div><div class="kana">'+D.kana+'</div>';
  const stage=card.querySelector('.stage');
  const cv=document.createElement('canvas');
  const padTop=3; // バウンドの余白（ドット単位）
  cv.width=D.w*SCALE; cv.height=(D.h+padTop)*SCALE;
  cv.style.maxWidth=(D.w*8)+'px';
  const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
  stage.appendChild(cv); grid.appendChild(card);
  sprites.push({D,ctx,cv,padTop, open:bake(D,true), blink:bake(D,false), phase:idx*0.7});
});

let t=0;
function frame(){
  t+=1;
  for(const s of sprites){
    const {ctx,cv,D,padTop}=s;
    ctx.clearRect(0,0,cv.width,cv.height);
    // 上下バウンド（ドット単位＝1マスずつ動かして“ドットらしさ”を保つ）
    let bob=0, blink=false;
    if(!reduce){
      const cyc=Math.sin(t*0.06 + s.phase);
      bob = cyc>0.5?2 : cyc>0? 1 : 0;
      const bt=(t + s.phase*30) % 240;
      blink = bt<8;               // ときどき まばたき
    }
    const src = blink ? s.blink : s.open;
    ctx.drawImage(src, 0,0, D.w,D.h, 0, (padTop-bob)*SCALE, D.w*SCALE, D.h*SCALE);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
